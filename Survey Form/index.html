<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Survey Form</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <h1 id="title">Build a Survey Form</h1>
  <p id="description">Thank you for taking the time to help us improve the platform </p>

  <form id="survey-form">
    <label id="name-label" for="name">Name</label>
    <input id="name" name="name" type="text" placeholder="Enter your name" required />

    <label id="email-label" for="email">Email</label>
    <input id="email" name="email" type="email" placeholder="Enter your email" required />

    <label id="number-label" for="number">Age (1-100)</label>
    <input id="number" name="age" type="number" min="1" max="100" placeholder="Enter your age" required />

    <label for="dropdown">Which option best describes your role?</label>
    <select id="dropdown" name="role" required>
      <option value="" disabled selected>Select your role</option>
      <option value="student">Student</option>
      <option value="developer">Developer</option>
    </select>

    <p>Would you recommend this platform to a friend?</p>
    <label> <input type="radio" name="recommend" value="yes" /> Yes </label>
    <label> <input type="radio" name="recommend" value="no" /> No </label>

    <p>What would you like to see improved? (Check all that apply)</p>
    <label>
      <input type="checkbox" name="improve" value="frontend" /> Front-end
      Projects
    </label>

    <label>
      <input type="checkbox" name="improve" value="backend" /> Back-end
      Projects
    </label>

    <label for="comments">Additional Comments</label>
    <textarea id="comments" name="comments" placeholder="Enter your comments here..."></textarea>
    <button id="submit" type="submit">Submit</button>
  </form>
</body>

</html>
