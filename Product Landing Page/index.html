<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Landing Page</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- Header -->
  <header id="header">
    <img id="header-img"
    src="https://media.tenor.com/Z6gmDPeM6dgAAAA1/dance-moves.webp"      alt="Logo" />

    <nav id="nav-bar">
      <a href="#features" class="nav-link">Features</a>
      <a href="#how-it-works" class="nav-link">How It Works</a>
      <a href="#pricing" class="nav-link">Pricing</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main>

    <!-- Section: Features -->
    <section id="features">
      <h2>Features</h2>
      <p>Our product is fast, reliable, and easy to use. Built with modern technology.But you are rickrolled..._...</p>

    </section>

    <!-- Section: How it works -->
    <section id="how-it-works">
      <h2>How It Works</h2>
      <iframe id="video" width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen></iframe>
    </section>

    <!-- Section: Pricing -->
    <section id="pricing">
      <h2>Pricing</h2>
      <div class="pricing-container">
        <div class="price-box">
          <h3>Basic</h3>
          <p>$10/month</p>
        </div>
        <div class="price-box">
          <h3>Pro</h3>
          <p>$30/month</p>
        </div>
        <div class="price-box">
          <h3>Enterprise</h3>
          <p>$100/month</p>
        </div>
      </div>
    </section>

    <!-- Signup Form -->
    <section id="signup">
      <h2>Sign up for updates</h2>
      <form id="form" action="https://www.freecodecamp.com/email-submit">
        <input id="email" name="email" type="email" placeholder="Enter your email" required />
        <input id="submit" type="submit" value="Get Started" />
      </form>
    </section>

  </main>

</body>

</html>
